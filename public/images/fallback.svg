<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080B12"/>
      <stop offset="50%" stop-color="#141D29"/>
      <stop offset="100%" stop-color="#080B12"/>
    </linearGradient>
    <radialGradient id="light" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#F32745" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#080B12" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <circle cx="400" cy="180" r="280" fill="url(#light)"/>
  
  <!-- Cricket pitch & crease lines -->
  <ellipse cx="400" cy="380" rx="340" ry="80" fill="#101620" stroke="#263140" stroke-width="2"/>
  <rect x="340" y="320" width="120" height="70" fill="#1A2433" rx="4"/>
  <line x1="340" y1="360" x2="460" y2="360" stroke="#F32745" stroke-width="2" stroke-dasharray="4 4"/>
  
  <!-- Stumps -->
  <rect x="388" y="270" width="5" height="50" fill="#E2E8F0"/>
  <rect x="398" y="270" width="5" height="50" fill="#E2E8F0"/>
  <rect x="408" y="270" width="5" height="50" fill="#E2E8F0"/>
  <rect x="385" y="267" width="31" height="4" fill="#F32745" rx="1"/>

  <!-- Logo and Editorial Badge -->
  <text x="400" y="160" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" fill="#F4F6FA" letter-spacing="2">REDHOT SPORTS</text>
  <text x="400" y="195" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="14" fill="#F32745" letter-spacing="3">CRICKET INTELLIGENCE</text>
</svg>
